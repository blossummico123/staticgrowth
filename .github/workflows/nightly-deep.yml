name: "AI Sentinel — Nightly Deep Scan"

on:
  schedule:
    # Run at 2:00 AM UTC every day
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  # ── CodeQL Deep Analysis ────────────────────────────────────────
  codeql:
    name: "CodeQL Deep Analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # ── BAIT Backdoor Detection ────────────────────────────────────
  bait:
    name: "BAIT Behavioral Backdoor Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check for model files
        id: check
        run: |
          if find . -name "*.pt" -o -name "*.pth" -o -name "*.bin" -o -name "*.safetensors" | grep -q .; then
            echo "has_models=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_models=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install BAIT
        if: steps.check.outputs.has_models == 'true'
        run: |
          git clone https://github.com/SolidShen/BAIT.git /tmp/bait
          cd /tmp/bait && pip install -e . || true

      - name: Run BAIT scan
        if: steps.check.outputs.has_models == 'true'
        run: |
          mkdir -p results/bait
          bait-scan --model-zoo-dir . --output-dir results/bait || true

      - uses: actions/upload-artifact@v4
        if: always() && steps.check.outputs.has_models == 'true'
        with:
          name: bait-results
          path: results/bait/

  # ── Pickle-Fuzzer Scanner Validation ───────────────────────────
  validate-scanners:
    name: "Scanner Validation (Pickle-Fuzzer)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Pickle-Fuzzer
        run: cargo install pickle-fuzzer || true

      - name: Install scanners
        run: pip install modelscan picklescan "modelaudit[all]" "fickling[torch]" || true

      - name: Run validation
        run: |
          mkdir -p sentinel-results/validation
          bash scripts/validate-scanners.sh || true
        env:
          RESULTS_DIR: "sentinel-results"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-results
          path: sentinel-results/validation/

  # ── Nightly Report ─────────────────────────────────────────────
  nightly-report:
    name: "Nightly Report"
    runs-on: ubuntu-latest
    needs: [codeql, bait, validate-scanners]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: sentinel-results
          merge-multiple: true
      - name: Summary
        run: |
          echo "## AI Sentinel — Nightly Deep Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Date:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| CodeQL | ${{ needs.codeql.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| BAIT | ${{ needs.bait.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Scanner Validation | ${{ needs.validate-scanners.result }} |" >> "$GITHUB_STEP_SUMMARY"

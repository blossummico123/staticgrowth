[project]
name = "ai-sentinel"
version = "0.1.0"
description = "Orchestration layer for AI/ML security scanning — one pipeline, one config, one report."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"

[project.optional-dependencies]
# Minimal stack (Phase 1)
minimal = [
    "modelscan",
    "aisbom-cli",
]

# Full scanning stack
scanning = [
    "modelscan",
    "picklescan",
    "modelaudit[all]",
    "veritensor[all]",
    "fickling[torch]",
    "aisbom-cli",
    "cve-bin-tool",
    "semgrep",
]

# Prompt testing
# NOTE: promptfoo is a Node.js package (npm install -g promptfoo), NOT a pip package.
# It must be installed separately via npm or in the Dockerfile.
prompts = []

# Agent scanning (Python pip packages)
agents = [
    "agentic-radar",
    "snyk-agent-scan",     # was mcp-scan, renamed after Snyk acquisition
]

# Azure AI Foundry integration
azure = [
    "azure-ai-ml>=1.12",
    "azure-identity>=1.15",
]

# Development
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

# ===========================================================================
# NON-PYTHON TOOLS — installed via Dockerfile / install.sh, NOT pip:
#   - CodeQL          (C++ binary — download tarball)
#   - OSV-Scanner     (Go — go install)
#   - Syft            (Go — Anchore install script)
#   - Promptfoo       (Node.js — npm install -g)
#   - SafeDep Vet     (Go — download binary)
#   - CycloneDX CLI   (.NET — download binary)
#   - Pickle-Fuzzer   (Rust — cargo install)
# ===========================================================================
